---
name: Traefik
version: dev
slug: traefik
description: Reverse Proxy for Web Services
arch:
  - aarch64
  - amd64
startup: system
init: false
image: ghcr.io/pheelee/traefik/{arch}
ports:
  80/tcp: 80
  443/tcp: 443
options:
  loglevel: error
  email: ""
  authEndpoint: ""
  cookieSecret: your-super-secure-string-here
  insecureSkipVerify: false
  environment: []
  hosts: []
  rootCAs: []
ingress: true
panel_icon: mdi:routes
schema:
  loglevel: list(debug|panic|fatal|error|warn|info)
  email: email
  authEndpoint: str?
  cookieSecret: str?
  insecureSkipVerify: bool
  environment:
    - str?
  hosts:
    - str?
  rootCAs:
    - str?
url: https://github.com/pheelee/hassio-addon-traefik
