---
name: Runtime validation

# yamllint disable-line rule:truthy
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test checksum and packaging contracts
        run: python3 -m unittest discover -s tests -v
  smoke:
    name: Runtime (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read image metadata
        id: metadata
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: python3 scripts/image-metadata.py "$BUILD_ARCH" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: traefik
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ steps.metadata.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          load: true
          tags: traefik-addon-test:${{ matrix.arch }}
          cache-from: type=gha,scope=smoke-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.arch }}
      - name: Verify metadata and test routing
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          ADMIN_VERSION: ${{ steps.metadata.outputs.admin_version }}
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python3 scripts/check-image-metadata.py "traefik-addon-test:$BUILD_ARCH" "$BUILD_ARCH" "$BUILD_VERSION"
          python3 scripts/smoke-test.py "traefik-addon-test:$BUILD_ARCH" --expected-version "$ADMIN_VERSION"
