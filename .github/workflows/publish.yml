---
name: Deploy

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

jobs:
  source:
    name: Validate publishing source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Require reviewed main history before privileged jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/check-release-source.py
  catalog:
    needs: source
    name: Check catalog integration
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require a configured catalog receiver and dispatch token
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Configure the DISPATCH_TOKEN repository secret.' >&2; exit 1; }
          gh api repos/pheelee/hassio/contents/.apps.yml --silent
          gh api repos/pheelee/hassio/contents/.github/workflows/traefik-update.yml --silent
  ci:
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: hassio-addons/workflows/.github/workflows/app-ci.yaml@e0c532a7b0fb264b3ff0c718c2c0308a0c8c1390 # v4.0.0
  smoke: # zizmor: ignore[self-repository] -- Keep actionlint-compatible local workflow syntax.
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
  deploy:
    needs: [source, catalog, ci, smoke]
    permissions:
      contents: read
      packages: write
    uses: hassio-addons/workflows/.github/workflows/app-deploy.yaml@e0c532a7b0fb264b3ff0c718c2c0308a0c8c1390 # v4.0.0
    with:
      repository: hassio
      repository_beta: hassio
      repository_edge: hassio
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
