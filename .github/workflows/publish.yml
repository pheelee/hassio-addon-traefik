name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/build.yml
    with:
      publish: true
      release_tag: ${{ github.event.release.tag_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
