---
name: Renovate

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require a Renovate credential
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if test -z "$RENOVATE_TOKEN"; then
            echo 'Configure the RENOVATE_TOKEN repository secret.' >&2
            exit 1
          fi
      - name: Run Renovate for this repository
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_BRANCH_PREFIX: renovate-actions/
          RENOVATE_GIT_AUTHOR: pheelee <pri@irbe.ch>
          RENOVATE_IGNORE_SCRIPTS: "true"
