---
name: Renovate

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Create repository-scoped GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-app-token
        env:
          NODE_USE_ENV_PROXY: "1"
        with:
          client-id: ${{ vars.GHA_IRBE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.GHA_IRBE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
      - name: Run Renovate for this repository
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ steps.generate-app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_BRANCH_PREFIX: renovate-actions/
          RENOVATE_IGNORE_SCRIPTS: "true"
