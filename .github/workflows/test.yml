name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  images:
    uses: ./.github/workflows/build.yml
  build:
    name: Test build
    if: always()
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - name: Require every architecture to pass
        env:
          RESULT: ${{ needs.images.result }}
        run: test "$RESULT" = success
